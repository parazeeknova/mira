[project]
name = "serve"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu>=1.13.2",
    "google-cloud-vision>=3.15.0",
    "httpx>=0.28.1",
    "insightface>=0.7.3",
    "numpy>=1.26",
    "nvidia-cublas-cu12>=12.9.2.10 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cuda-runtime-cu12>=12.9.79 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cudnn-cu12>=9.0.0",
    "nvidia-cufft-cu12>=11.4.1.4 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-curand-cu12>=10.3.5",
    "onnxruntime-gpu>=1.24.4 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "onnxruntime>=1.24.0 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "pillow>=12.1.1",
    "supervision>=0.27.0.post2",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.8",
]

[tool.pyright]
include = ["src"]
stubPath = "src/stubs"
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
# NixOS / CI: venv may not be fully synced (CUDA wheels), so ignore missing imports
# when running `uv run --with pyright` without a full `uv sync`.
reportMissingImports = "none"
reportMissingModuleSource = "none"
reportAttributeAccessIssue = "none"
# Dynamic JSON handling in pipeline/facecheck/cache triggers Unknown across 52 locations;
# strict mode is useful for business logic, but these Any-heavy boundaries are intentionally permissive.
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportUnnecessaryIsInstance = "none"

# Tests legitimately poke private members (white-box assertions) and use
# pytest-asyncio's untyped `@pytest.mark.asyncio` decorator
[[tool.pyright.executionEnvironments]]
root = "src"
reportPrivateUsage = "none"
reportUnusedVariable = "none"
reportMissingParameterType = "none"
reportUntypedFunctionDecorator = "none"

[tool.pytest.ini_options]
# Feature layout: packages live in src/, tests colocated as *_test.py
testpaths = ["src"]
python_files = ["*_test.py"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "N", "ANN", "SIM", "RET", "PL", "RUF"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"src/stubs/**/*.pyi" = ["N802"]
"**/*_test.py" = ["PLR2004", "PLC0415", "RUF003", "ANN202", "ANN001", "ANN003", "RUF002", "E501", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
