<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mira</title>
    <link rel="icon" type="image/svg+xml" href="/mira.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="stage">
      <video id="camera-feed" autoplay muted playsinline></video>
      <canvas id="overlay-canvas"></canvas>
      <canvas id="capture-canvas" hidden></canvas>

      <button id="pipeline-button" type="button">
        <span id="pipeline-button-label">scan</span>
      </button>

      <details id="menu-shell" class="menu-shell">
        <summary id="menu-toggle" aria-label="open controls">mira</summary>

        <section id="options-panel">
          <header class="card" id="hud-chain">
            <span id="hud-status">idle</span>
            <span id="hud-verified-badge">—</span>
            <span id="hud-tx-preview">—</span>
            <button id="hud-proof-button" type="button">proof</button>
          </header>

          <section class="card" id="hud-face" hidden>
            <span id="hud-face-confidence">0%</span>
            <span id="hud-cache-badge">—</span>
            <span id="hud-anchor-badge">—</span>
          </section>

          <section class="card" id="hud-results"></section>

          <section class="card" id="proof-card" hidden>
            <header>
              <span>proof</span>
              <button id="proof-close" type="button">x</button>
            </header>
            <dl>
              <dt>status</dt>
              <dd id="proof-status">—</dd>
              <dt>content hash</dt>
              <dd><code id="proof-content-hash">—</code></dd>
              <dt>face hash</dt>
              <dd><code id="proof-face-hash">—</code></dd>
              <dt>tx</dt>
              <dd>
                <a id="proof-tx-link" target="_blank" rel="noopener">—</a>
              </dd>
              <dt>block</dt>
              <dd id="proof-block">—</dd>
              <dt>engines</dt>
              <dd id="proof-engines">—</dd>
              <dt>top match</dt>
              <dd><a id="proof-url" target="_blank" rel="noopener">—</a></dd>
            </dl>
          </section>

          <section class="card" id="stats">
            <dl>
              <dt>conn</dt>
              <dd id="connection-value">offline</dd>
              <dt>frames</dt>
              <dd id="frame-counter">0</dd>
              <dt>latency</dt>
              <dd id="latency-chip">0</dd>
              <dt>providers</dt>
              <dd id="providers-value">pending</dd>
              <dt>tracking</dt>
              <dd id="tracking-value">pending</dd>
              <dt>enrollment</dt>
              <dd id="enrollment-value">pending</dd>
              <dt>index</dt>
              <dd id="index-value">pending</dd>
            </dl>
          </section>

          <section class="card" id="controls">
            <dl>
              <dt>interval</dt>
              <dd>
                <input
                  id="interval-input"
                  type="range"
                  min="40"
                  max="500"
                  value="80"
                  step="10"
                />
                <span id="interval-value">80</span>
              </dd>
              <dt>quality</dt>
              <dd>
                <input
                  id="quality-input"
                  type="range"
                  min="40"
                  max="95"
                  value="50"
                  step="1"
                />
                <span id="quality-value">0.50</span>
              </dd>
              <dt>camera</dt>
              <dd>
                <button id="camera-flip-button" type="button">flip</button>
              </dd>
            </dl>
          </section>

          <section class="card" id="enroll">
            <form id="enrollment-form">
              <input
                id="identity-name-input"
                type="text"
                name="name"
                placeholder="name"
                required
              />
              <input
                id="identity-works-at-input"
                type="text"
                name="worksAt"
                placeholder="works at"
              />
              <input
                id="identity-color-input"
                type="text"
                name="color"
                placeholder="#4ee3ff"
                value="#4ee3ff"
                required
              />
              <input
                id="identity-linkedin-input"
                type="text"
                name="linkedinId"
                placeholder="linkedin"
              />
              <input
                id="identity-github-input"
                type="text"
                name="githubUsername"
                placeholder="github"
              />
              <input
                id="identity-email-input"
                type="email"
                name="email"
                placeholder="email"
              />
              <input
                id="identity-phone-input"
                type="tel"
                name="phoneNumber"
                placeholder="phone"
              />
              <input
                id="identity-files-input"
                type="file"
                name="files"
                accept=".jpg,.jpeg,.png,.webp"
                multiple
              />
              <button id="enroll-submit-button" type="submit">upload</button>
              <span id="enrollment-status">idle</span>
            </form>
            <div id="enrollment-list"></div>
            <div id="enrollment-diagnostics"></div>
          </section>
        </section>
      </details>
    </main>

    <script type="module" src="/client/app.js"></script>
  </body>
</html>
